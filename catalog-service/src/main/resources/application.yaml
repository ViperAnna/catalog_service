spring:

#APPLICATION
  application:
    name: catalog_service

#DB
  data:
    mongodb:
      host: ${SPRING_DATA_MONGODB_HOST:mongodb}
      port: ${SPRING_DATA_MONGODB_PORT:27017}
      database: ${SPRING_DATA_MONGODB_DATABASE}
      username: ${SPRING_DATA_MONGODB_USERNAME}
      password: ${SPRING_DATA_MONGODB_PASSWORD}

  profiles:
    active: dev

  main:
    banner-mode: console

  output:
    ansi:
      enabled: ALWAYS

app:
  init:
    categories: true
    products: true
    # force: false


#CORS
cors:
  mapping:
    path: ${CORS_MAPPING_PATH}
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS}
    methods: ${CORS_ALLOWED_METHODS}
    headers: ${CORS_ALLOWED_HEADERS}

#MinIO
minio:
  endpoint: http://minio:9000
  public-endpoint: http://minio:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  # bucket-name: categories

#Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

#Logging
logging:
  level:
    root: INFO
    org:
      mongodb:
        driver: WARN

  file:
    name: /app/logs/application.log

  pattern:
    file: "%d{HH:mm:ss.SSS} [%-5level]  %logger{1}  - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: /app/logs/application.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 3
      total-size-cap: 100MB
