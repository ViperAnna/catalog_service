spring:



#APPLICATION
  application:
    name: catalog_service

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

#KAFKA (store-events-topic -> архивация товаров удаленного магазина)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # новая группа catalog-group читает топик с начала, чтобы не пропустить события до первого подключения
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # потребителя запускает StoreEventListenerStarter с повторами, чтобы старт без Kafka не падал
      auto-startup: false

  security:
    oauth2:
      resource-server:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI}
          issuer-uri: ${JWT_ISSUER_URI}

#DB
  data:
    mongodb:
      host: ${SPRING_DATA_MONGODB_HOST:mongodb}
      port: ${SPRING_DATA_MONGODB_PORT:27017}
      database: ${SPRING_DATA_MONGODB_DATABASE}
      username: ${SPRING_DATA_MONGODB_USERNAME}
      password: ${SPRING_DATA_MONGODB_PASSWORD}

  profiles:
    active: dev

  main:
    banner-mode: console

  output:
    ansi:
      enabled: ALWAYS

app:
  init:
    categories: true
    products: true
    # force: false


#MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER}}
  secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD}}
  # bucket-name: categories

#Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

#Logging
logging:
  level:
    root: INFO
    org:
      mongodb:
        driver: WARN

  file:
    name: /app/logs/application.log

  pattern:
    file: "%d{HH:mm:ss.SSS} [%-5level]  %logger{1}  - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: /app/logs/application.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 3
      total-size-cap: 100MB

seller-service:
  url: lb://SELLER-SERVICE