services:

  # ----------Catalog Service----------
  catalog-service:
    image: viperanna/catalog-service:${CATALOG_SERVICE_TAG}
    container_name: catalog-service
    expose:
      - "8080"
    env_file:
      - .env.catalog
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  #  ----------User service----------
  user-service:
    image: viperanna/user-service:${USER_SERVICE_TAG}
    container_name: user-service
    expose:
      - "8080"
    env_file:
      - .env.user
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  #  ----------Notification service----------
  notification-service:
    image: viperanna/notification-service:${NOTIFICATION_SERVICE_TAG}
    container_name: notification-service
    expose:
      - "8080"
    env_file:
      - .env.notification
    depends_on:
      kafka:
        condition: service_started
      discovery-service:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped

  # ----------Frontend----------
  front:
    image: viperanna/front:${FRONTEND_TAG}
    container_name: front
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped
    networks:
      - default

  #  ----------Api gateway----------
  api-gateway:
    image: viperanna/api-gateway:${API_GATEWAY_TAG}
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  #  ----------Discovery service----------
  discovery-service:
    image: viperanna/discovery-service:${DISCOVERY_SERVICE_TAG}
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8761" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped


  #  ----------Kafka----------
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      #      KAFKA_KRAFT_CLUSTER_ID=YNA9ZgkRSH-xoHmnE0d5gw
      KAFKA_PROCESS_ROLES: broker,controller
      #      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      #      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      #      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    #      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
    #      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
    #      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    #      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    volumes:
      - kafka_data:/var/lib/kafka

  #  ----------Kafka UI----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092


  #  ----------POSTGRES----------
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5433:5432"
    env_file:
      - .env.postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------MongoDB----------
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27018:27017"
    env_file:
      - .env.mongodb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >
        bash -c '
        mongosh --quiet \
          -u "$$MONGO_INITDB_ROOT_USERNAME" \
          -p "$$MONGO_INITDB_ROOT_PASSWORD" \
          --authenticationDatabase admin \
          --eval "db.runCommand({connectionStatus: 1}).ok === 1"
        '
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------MinIO----------
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.minio
    command: server /data --console-address ":9001"
    volumes:
      - ./minio/data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  # ----------Create Buckets----------
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/categories &&
       mc mb --ignore-existing myminio/products &&
      mc anonymous set public myminio/categories &&
      mc anonymous set public myminio/products
      
      "
    restart: "no"

volumes:
  mongodb_data:
  pgdata:
  kafka_data:

networks:
  default:
    name: catalog_service_default
    driver: bridge
