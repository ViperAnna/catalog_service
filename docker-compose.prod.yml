services:

  # ----------Catalog Service----------
  catalog-service:
    image: viperanna/catalog-service:${CATALOG_SERVICE_TAG}
    container_name: catalog-service
    expose:
      - "8080"
    env_file:
      - .env.catalog
      - .env.mongodb
      - .env.minio
      - .env.kafka
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  #  ----------User service----------
  user-service:
    image: viperanna/user-service:${USER_SERVICE_TAG}
    container_name: user-service
    expose:
      - "8080"
    env_file:
      - .env.user
      - .env.postgres
      - .env.kafka
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  #  ----------Notification service----------
  notification-service:
    image: viperanna/notification-service:${NOTIFICATION_SERVICE_TAG}
    container_name: notification-service
    expose:
      - "8080"
    env_file:
      - .env.notification
      - .env.postgres
      - .env.kafka
    depends_on:
      kafka:
        condition: service_started
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  # ----------Frontend----------
  front:
    image: viperanna/front:${FRONTEND_TAG}
    container_name: front
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped

  #  ----------Api gateway----------
  api-gateway:
    image: viperanna/api-gateway:${API_GATEWAY_TAG}
    container_name: api-gateway
    env_file:
      - .env.kafka
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  #  ----------Discovery service----------
  discovery-service:
    image: viperanna/discovery-service:${DISCOVERY_SERVICE_TAG}
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8761" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped


  #  ----------Kafka----------
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    env_file:
      - .env.kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka

  #  ----------Kafka UI----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  #  ----------Keycloak----------
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    env_file:
      - .env.keycloak
    command:
      - start
    ports:
      - "8181:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  #  ----------POSTGRES----------
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5433:5432"
    env_file:
      - .env.postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------MongoDB----------
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27018:27017"
    env_file:
      - .env.mongodb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >
        bash -c '
        mongosh --quiet \
          -u "$$MONGO_INITDB_ROOT_USERNAME" \
          -p "$$MONGO_INITDB_ROOT_PASSWORD" \
          --authenticationDatabase admin \
          --eval "db.runCommand({connectionStatus: 1}).ok === 1"
        '
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------MinIO----------
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.minio
    command: server /data --console-address ":9001"
    volumes:
      - ./minio/data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  # ----------Create Buckets----------
  createbuckets:
    image: minio/mc
    env_file:
      - .env.minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" &&
      mc mb --ignore-existing myminio/categories &&
       mc mb --ignore-existing myminio/products &&
      mc anonymous set public myminio/categories &&
      mc anonymous set public myminio/products
      "
    restart: "no"

volumes:
  mongodb_data:
  pgdata:
  kafka_data:

networks:
  default:
    name: catalog_service_default
    driver: bridge
