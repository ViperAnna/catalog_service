server {
    listen 80;
    server_name v693663.hosted-by-vdsina.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location ^~ /api/ {
        if ($request_method = OPTIONS ) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin,X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            return 204;
        }

             proxy_pass http://catalog-service:8080/;

             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name v693663.hosted-by-vdsina.com;

    ssl_certificate /etc/letsencrypt/live/v693663.hosted-by-vdsina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v693663.hosted-by-vdsina.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/ {
        if ($request_method = OPTIONS ) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin,X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://catalog-service:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    location / {
        try_files $uri $uri/ /index.html;
    }



    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}