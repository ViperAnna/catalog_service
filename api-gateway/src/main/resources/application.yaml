server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**,/admin/users/**,/wishlists/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notifications/**

            - id: categories
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/categories/**

            - id: products
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/products/**
          discovery:
            locator:
              enabled: ${GATEWAY_DISCOVERY_LOCATOR_ENABLED}
              lower-case-service-id: true

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS}
                allowedMethods: ${CORS_ALLOWED_METHODS}
                allowedHeaders: ${CORS_ALLOWED_HEADERS}
                allowCredentials: ${CORS_ALLOW_CREDENTIALS}
                maxAge: ${CORS_MAX_AGE}

logging:
  level:
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL}
    reactor.netty.http.client: ${GATEWAY_NETTY_LOG_LEVEL}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}